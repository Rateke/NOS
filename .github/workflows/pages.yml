# Publica a fatia jogável no GitHub Pages a cada push.
#
# Para ligar, uma única vez: no GitHub, Settings > Pages > Build and deployment
# > Source: "GitHub Actions". Não precisa escolher branch nem pasta.
name: Publicar o jogo no GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/nos-roteiro-narrativo-lz8r6r
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deixa um deploy em andamento terminar, sem enfileirar vários.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # O playwright só serve para o teste local; sem isto o CI baixaria um
      # navegador inteiro à toa.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Instalar dependências
        working-directory: game
        run: npm ci

      - name: Conferir tipos e construir
        working-directory: game
        run: npm run build

      - name: Gerar também o arquivo único
        working-directory: game
        run: node scripts/build-single.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
